services:
  bot:
    image: ghcr.io/robdeflop/7tv-discord-sync:${BOT_VERSION:?Set BOT_VERSION to the release version without v}
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:?Set DISCORD_TOKEN}
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/sync
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: sync
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "sync"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
