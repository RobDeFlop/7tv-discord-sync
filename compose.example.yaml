# Local development only. The bot runs separately on the host.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: sync
      POSTGRES_PASSWORD: sync_local
      POSTGRES_DB: 7tv_sync
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "sync", "-d", "7tv_sync"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 10s

volumes:
  postgres-data:
