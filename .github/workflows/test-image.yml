name: Test and release bot image

on:
  pull_request:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  IMAGE: ghcr.io/robdeflop/7tv-discord-sync

jobs:
  test-image:
    if: github.event_name == 'pull_request' || !github.event.deleted
    runs-on: ubuntu-latest
    outputs:
      release-tags: ${{ steps.version.outputs.tags }}
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: test-only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test release tag policy without uploading
        run: bash .github/scripts/release-tags.test.sh
      - name: Validate release tag
        id: version
        if: github.event_name == 'push'
        run: |
          tags=$(bash .github/scripts/release-tags.sh "$GITHUB_REF")
          printf 'tags<<END\n%s\nEND\n' "$tags" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "${tags%%$'\n'*}" >> "$GITHUB_OUTPUT"
      - name: Build locally and verify the anonymous installation bundle
        env:
          VERSION: ${{ steps.version.outputs.version || '1.2.0' }}
        run: |
          versions=("$VERSION")
          if [[ $GITHUB_EVENT_NAME == pull_request ]]; then versions+=(1.3.0-beta.1); fi
          for version in "${versions[@]}"; do
            docker build --platform linux/amd64 --provenance=false --build-arg "BOT_VERSION=$version" \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" -t "$IMAGE:$version" .
            bash scripts/test-install-bundle.sh "$version"
          done
          docker tag "$IMAGE:$VERSION" bot:test
      - name: Migrate a fresh database and convert emote images with the runtime image
        run: |
          docker run --rm --network container:${{ job.services.postgres.id }} \
            -e TEST_DATABASE_URL=postgres://postgres:test-only@localhost:5432/postgres \
            --mount "type=bind,src=$PWD/src/adapters/store/postgres-store.test.ts,dst=/app/src/adapters/store/postgres-store.test.ts,readonly" \
            --mount "type=bind,src=$PWD/src/image/pipeline.test.ts,dst=/app/src/image/pipeline.test.ts,readonly" \
            bot:test bun test --timeout 30000 ./src/adapters/store/postgres-store.test.ts ./src/image/pipeline.test.ts
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun test --timeout 30000
        env:
          TEST_DATABASE_URL: postgres://postgres:test-only@localhost:${{ job.services.postgres.ports[5432] }}/postgres
      - name: Save the tested image for publication
        if: github.event_name == 'push'
        run: docker save -o "$RUNNER_TEMP/bot.tar" bot:test
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: tested-bot
          path: ${{ runner.temp }}/bot.tar
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  publish:
    if: github.event_name == 'push' && needs.test-image.outputs.release-tags != ''
    needs: test-image
    runs-on: ubuntu-latest
    permissions:
      packages: write
    env:
      RELEASE_TAGS: ${{ needs.test-image.outputs.release-tags }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tested-bot
          path: ${{ runner.temp }}
      - run: docker load -i "$RUNNER_TEMP/bot.tar"
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Publish tested tags
        run: |
          while IFS= read -r tag; do
            docker tag bot:test "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done <<< "$RELEASE_TAGS"
